<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombies Battle Royale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #ff4444;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        canvas {
            border: 3px solid #ff4444;
            background-color: #0a0a0a;
            display: block;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        #stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background-color: #222;
            padding: 15px 25px;
            border-radius: 5px;
            border: 2px solid #ff4444;
        }

        .stat-box h3 {
            color: #ff4444;
            margin-bottom: 8px;
        }

        .stat-box p {
            font-size: 18px;
            font-weight: bold;
        }

        #gameStatus {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .game-over {
            color: #ff0000;
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧟 Zombies Battle Royale 🧟</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="stats">
            <div class="stat-box">
                <h3>Jugador</h3>
                <p id="playerName">Player1</p>
            </div>
            <div class="stat-box">
                <h3>Salud</h3>
                <p id="playerHealth">100 / 100</p>
            </div>
            <div class="stat-box">
                <h3>Puntuación</h3>
                <p id="playerScore">0</p>
            </div>
            <div class="stat-box">
                <h3>Ola</h3>
                <p id="wave">1</p>
            </div>
            <div class="stat-box">
                <h3>Zombies</h3>
                <p id="zombieCount">0</p>
            </div>
        </div>

        <div id="gameStatus"></div>
    </div>

    <script src="game.js"></script>
    <script src="render.js"></script>
</body>
</html>
